<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PMGSY-III Agreement Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: sticky progress header, then one collapsible cluster per bidder holding its works as checklist rows */
:root{
  --bg:#f3f2ee; --surface:#ffffff; --ink:#1d1f22; --muted:#62666d; --line:#dcdad3;
  --accent:#e89a0c; --accent-ink:#5a3a00; --accent-soft:#fbecc9;
  --done:#2f7d4f; --done-soft:#dcefe3; --set55:#2c5d8f; --set41:#8a4b2a;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16181b; --surface:#1f2226; --ink:#ecebe6; --muted:#9a9ea5; --line:#33373d;
  --accent:#f2ad2f; --accent-ink:#fbe3b0; --accent-soft:#3d3018;
  --done:#5fbf86; --done-soft:#1c3326; --set55:#7fb2e5; --set41:#e0a07c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16181b; --surface:#1f2226; --ink:#ecebe6; --muted:#9a9ea5; --line:#33373d;
  --accent:#f2ad2f; --accent-ink:#fbe3b0; --accent-soft:#3d3018;
  --done:#5fbf86; --done-soft:#1c3326; --set55:#7fb2e5; --set41:#e0a07c; color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{padding-block:14px 12px;display:grid;gap:10px}
.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
h1{font-family:var(--f-display);font-size:1.7rem;line-height:1.05;margin:0;letter-spacing:.01em;text-wrap:balance}
h1 small{display:block;font-family:var(--f-body);font-size:.8rem;font-weight:500;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.acct{display:flex;gap:8px;align-items:center;margin-left:auto}
.overall{font-family:var(--f-display);font-size:1.35rem;font-variant-numeric:tabular-nums}
.overall span{color:var(--muted);font-size:.95rem;font-family:var(--f-body)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.bar.full i{background:var(--done)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:600 .85rem var(--f-body);background:transparent;color:var(--ink);border:0;padding:7px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
input[type=search]{flex:1 1 200px;min-width:0;font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{font-size:.8rem;color:var(--muted)}
main .wrap{padding-block:16px 40px;display:grid;gap:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}
.legend .nowrap{white-space:nowrap}
.legend b{font-family:var(--f-mono);font-weight:500;color:var(--ink)}
details.bidder{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details.bidder>summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center}
details.bidder>summary::-webkit-details-marker{display:none}
.bname{font-family:var(--f-display);font-size:1.3rem;line-height:1.1;min-width:0}
.bname::before{content:"▸";display:inline-block;width:1em;color:var(--muted);transition:transform .15s}
details[open] .bname::before{transform:rotate(90deg)}
.bmeta{font-size:.82rem;color:var(--muted);grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 12px}
.bcount{font-family:var(--f-display);font-size:1.15rem;font-variant-numeric:tabular-nums;text-align:right}
.bcount.complete{color:var(--done)}
summary .bar{grid-column:1/-1}
.bdocs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:0 16px 12px;font-size:.82rem;color:var(--muted)}
.works{border-top:1px solid var(--line)}
.work{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:8px 18px;padding:12px 16px;border-bottom:1px solid var(--line)}
.work:last-child{border-bottom:0}
.work.complete{background:var(--done-soft)}
.winfo{min-width:0;display:grid;gap:3px}
.wtop{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pkg{font-family:var(--f-mono);font-size:.9rem;font-weight:500}
.tag{font-size:.7rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:4px;border:1px solid currentColor}
.tag.s55{color:var(--set55)}.tag.s41{color:var(--set41)}
.road{font-weight:500}
.sub{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.chip{font:500 .8rem var(--f-body);display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;user-select:none}
.chip::before{content:"";width:12px;height:12px;border-radius:3px;border:1.5px solid var(--muted);flex:none}
.chip[aria-pressed="true"]{background:var(--done);border-color:var(--done);color:var(--surface)}
.chip[aria-pressed="true"]::before{border-color:var(--surface);background:var(--surface);clip-path:polygon(14% 52%,0 66%,38% 100%,100% 22%,86% 8%,38% 72%)}
.chip:disabled{cursor:default;opacity:.7}
.chip .num{font:500 .72rem var(--f-mono);opacity:.7;order:-1}
.chip{text-align:left}
.bdocs .rowact{font-variant-numeric:tabular-nums}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
.rowact{font:600 .75rem var(--f-body);color:var(--accent-ink);background:var(--accent-soft);border:0;border-radius:6px;padding:5px 8px;cursor:pointer}
.empty{padding:28px;text-align:center;color:var(--muted)}
@media (max-width:720px){
  .work{grid-template-columns:1fr}
  h1{font-size:1.4rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<header><div class="wrap">
  <div class="top">
    <h1><small>PMGSY-III · MSRRDA Manipur · Agreement preparation</small>96 Packages Checklist</h1>
    <div class="acct"><button id="auth" class="rowact" hidden>Sign in with Google</button></div>
    <div class="overall" id="overall">0 / 96 <span>works complete</span></div>
  </div>
  <div class="bar" id="overallBar"><i></i></div>
  <div class="controls">
    <div class="seg" role="group" aria-label="Tender batch">
      <button id="set-all" data-set="all" aria-pressed="true">All 96</button>
      <button id="set-55" data-set="55" aria-pressed="false">55 works</button>
      <button id="set-41" data-set="41" aria-pressed="false">41 works</button>
    </div>
    <div class="seg" role="group" aria-label="Status">
      <button id="st-all" data-st="all" aria-pressed="true">Any</button>
      <button id="st-pending" data-st="pending" aria-pressed="false">Pending</button>
      <button id="st-done" data-st="done" aria-pressed="false">Done</button>
    </div>
    <input type="search" id="q" placeholder="Search package, road, district, PIU…" aria-label="Search works">
  </div>
  <div class="status" id="status">Loading saved ticks…</div>
</div></header>

<canvas id="fx" aria-hidden="true"></canvas>
<main><div class="wrap">
  <div class="legend" id="legend"></div>
  <div id="list"></div>
</div></main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="seed-works.js" onerror="void 0"></script>
<script>
let WORKS = [];
let worksMsg = "Sign in with Google to load the 96 works.";
let needList = false, fsRef = null;
const ITEMS = [
  ["given","Given to contractor for signature"],
  ["ce","Signed by CE"],
  ["scan","Scanned for re-distribution"],
  ["dist","Distributed to PIUs & contractor"]
];
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const lakh = v => v==null ? "–" : (v/1e5).toLocaleString("en-IN",{maximumFractionDigits:2});

let state = {};           // { "works/MN0191": {loa:true,...}, "bidders/slug": {ins:true} }
let filt = {set:"all", st:"all", q:""};
let open = new Set();
let db = null, canWrite = true;

try { const s = JSON.parse(localStorage.getItem("ui")||"{}"); if (s.set) filt.set=s.set; if (s.open) open=new Set(s.open); } catch(e){}
try { if (!Object.keys(state).length) state = JSON.parse(localStorage.getItem("ticks")||"{}"); } catch(e){}
const saveUI = () => { try { localStorage.setItem("ui", JSON.stringify({set:filt.set, open:[...open]})); } catch(e){} };

const workDone = w => ITEMS.filter(([k]) => state["works/"+w.pkg]?.[k]).length;
const isComplete = w => workDone(w) === ITEMS.length;

document.getElementById("legend").innerHTML =
  "Steps for each agreement: " + ITEMS.map(([,l],i)=>"<span class=\"nowrap\"><b>"+(i+1)+".</b> "+l+"</span>").join(" · ") +
  "<br>Amounts in ₹ lakh (quoted, incl. GST)";

function chip(path, key, label, on){
  const n = ITEMS.findIndex(([k])=>k===key)+1;
  return `<button class="chip" data-path="${path}" data-key="${key}" aria-pressed="${!!on}" ${canWrite?"":"disabled"}><span class="num">${n}</span>${label}</button>`;
}

function render(){
  const q = filt.q.trim().toLowerCase();
  const scope = WORKS.filter(w => filt.set==="all" || w.set===filt.set);
  const shown = scope.filter(w => {
    if (filt.st==="done" && !isComplete(w)) return false;
    if (filt.st==="pending" && isComplete(w)) return false;
    if (!q) return true;
    return [w.pkg,w.road,w.district,w.piu,w.bidder,w.agr].join(" ").toLowerCase().includes(q);
  });
  // overall
  const done = scope.filter(isComplete).length;
  document.getElementById("overall").innerHTML = `${done} / ${scope.length} <span>works complete</span>`;
  const ob = document.getElementById("overallBar");
  ob.firstElementChild.style.width = (scope.length? done/scope.length*100:0)+"%";
  ob.classList.toggle("full", done===scope.length && scope.length>0);

  // cluster by bidder
  const groups = new Map();
  for (const w of shown){ if(!groups.has(w.bidder)) groups.set(w.bidder,[]); groups.get(w.bidder).push(w); }
  const allByBidder = b => scope.filter(w=>w.bidder===b);
  const order = [...groups.keys()].sort((a,b)=>allByBidder(b).length-allByBidder(a).length || a.localeCompare(b));
  const list = document.getElementById("list");
  if (!order.length){ list.innerHTML = `<div class="empty">${WORKS.length ? "No works match. Clear the search or switch the status filter." : esc(worksMsg)}${!WORKS.length && needList ? `<div style="margin-top:12px"><label class="rowact" for="listFile" style="cursor:pointer">Choose work-list.json</label><input type="file" id="listFile" accept=".json,application/json" hidden></div>` : ""}</div>`; return; }

  list.innerHTML = order.map(b => {
    const ws = groups.get(b), all = allByBidder(b);
    const bs = slug(b);
    const c = all.filter(isComplete).length;
    const n55 = all.filter(w=>w.set==="55").length, n41 = all.filter(w=>w.set==="41").length;
    const total = all.reduce((s,w)=>s+(w.quoted||0),0);
    const isOpen = open.has(bs) || !!q || order.length===1;
    return `<details class="bidder" data-b="${bs}" ${isOpen?"open":""}>
      <summary>
        <span class="bname">${esc(b)}</span>
        <span class="bcount ${c===all.length?"complete":""}">${c}/${all.length}</span>
        <div class="bar ${c===all.length?"full":""}"><i style="width:${all.length?c/all.length*100:0}%"></i></div>
        <span class="bmeta"><span>${all.length} work${all.length>1?"s":""}${filt.set==="all"?` (55: ${n55} · 41: ${n41})`:""}</span><span>₹ ${lakh(total)} lakh</span><span>${esc(ws[0].addr||"")}</span></span>
      </summary>
      ${canWrite && ws.length>1 ? `<div class="bdocs">Tick for all ${ws.length} shown: ${ITEMS.map(([k,l],i)=>{
        const allOn = ws.every(w=>state["works/"+w.pkg]?.[k]);
        return `<button class="rowact" data-bulk="${bs}" data-key="${k}" title="${allOn?"Untick":"Tick"} “${l}” for every work listed here">${allOn?"Undo":"All"} step ${i+1}</button>`;}).join("")}</div>` : ""}
      <div class="works">${ws.map(w=>{
        const st = state["works/"+w.pkg]||{}, d = workDone(w);
        return `<div class="work ${d===ITEMS.length?"complete":""}">
          <div class="winfo">
            <div class="wtop"><span class="pkg">${w.pkg}</span><span class="tag s${w.set}">${w.set} works</span><span class="sub">${d}/${ITEMS.length}</span>
              ${canWrite?`<button class="rowact" data-all="${w.pkg}">${d===ITEMS.length?"Clear all":"Tick all"}</button>`:""}</div>
            <div class="road">${esc(w.road)}</div>
            <div class="sub">${esc(w.district||"")} · ${esc((w.piu||"").replace("Executive Engineer, ",""))} · ${w.len??"–"} km</div>
            <div class="sub">Quoted ₹ ${lakh(w.quoted)} · PS ₹ ${lakh(w.ps)} · Addl. PS ₹ ${lakh(w.aps)}</div>
            <div class="sub">${esc(w.agr||"")}</div>
          </div>
          <div class="chips">${ITEMS.map(([k,l])=>chip("works/"+w.pkg,k,l,st[k])).join("")}</div>
        </div>`;}).join("")}</div>
    </details>`;
  }).join("");
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

async function write(path, patch){ return writeMany([[path, patch]]); }
async function writeMany(pairs){
  for (const [path, patch] of pairs) state[path] = {...(state[path]||{}), ...patch};
  try { localStorage.setItem("ticks", JSON.stringify(state)); } catch(e){}
  render();
  if (!db) return;
  try { await Promise.all(pairs.map(([path]) => db.doc(path).set(state[path]))); setStatus("Saved · synced across your devices"); }
  catch(e){ setStatus("Could not save to the shared record ("+(e.code||e.message)+"). Ticks are kept on this device only."); }
}

// Fireworks: a small burst for each tick, a bigger show when a work's four steps are done
const fx = document.getElementById("fx"), ctx = fx.getContext("2d");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const COLORS = ["#f2ad2f","#e8590c","#2f9e5f","#3b82c4","#d6336c","#fcc419","#ffffff"];
let parts = [], raf = 0;
function sizeFx(){ const r = devicePixelRatio||1; fx.width = innerWidth*r; fx.height = innerHeight*r; ctx.setTransform(r,0,0,r,0,0); }
addEventListener("resize", sizeFx); sizeFx();
function burst(x, y, n){
  const hue = COLORS[Math.random()*COLORS.length|0];
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, s = 2+Math.random()*5;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,decay:.012+Math.random()*.018,
      c: Math.random()<.7 ? hue : COLORS[Math.random()*COLORS.length|0], r:1.5+Math.random()*2});
  }
  if (!raf) raf = requestAnimationFrame(tick);
}
function rocket(tx, ty, delay){
  setTimeout(() => {
    const p = {x:tx+(Math.random()-.5)*60, y:innerHeight, tx, ty, rocket:true, life:1};
    parts.push(p); if (!raf) raf = requestAnimationFrame(tick);
  }, delay);
}
function tick(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  ctx.globalCompositeOperation = "lighter";
  const next = [];
  for (const p of parts){
    if (p.rocket){
      p.x += (p.tx-p.x)*.12; p.y += (p.ty-p.y)*.12;
      ctx.fillStyle = "#ffd36b"; ctx.beginPath(); ctx.arc(p.x,p.y,2.5,0,7); ctx.fill();
      if (Math.abs(p.ty-p.y) < 6) burst(p.x, p.y, 70); else next.push(p);
      continue;
    }
    p.x += p.vx; p.y += p.vy; p.vy += .07; p.vx *= .985; p.vy *= .985; p.life -= p.decay;
    if (p.life <= 0) continue;
    ctx.globalAlpha = p.life; ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
    next.push(p);
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  parts = next;
  raf = parts.length ? requestAnimationFrame(tick) : 0;
  if (!raf) ctx.clearRect(0,0,innerWidth,innerHeight);
}
function celebrate(el, big){
  if (reduceMotion) return;
  const r = el.getBoundingClientRect(), x = r.left+r.width/2, y = r.top+r.height/2;
  burst(x, y, big ? 60 : 40);
  if (big) for (let i=0;i<4;i++) rocket(innerWidth*(.2+.6*Math.random()), innerHeight*(.15+.3*Math.random()), 120+i*220);
}
function setStatus(t){ document.getElementById("status").textContent = t; }

document.addEventListener("click", e => {
  const c = e.target.closest(".chip");
  if (c && !c.disabled){
    const on = c.getAttribute("aria-pressed")!=="true";
    const w = WORKS.find(x=>"works/"+x.pkg===c.dataset.path);
    const wasDone = isComplete(w);
    if (on) celebrate(c, false);
    write(c.dataset.path, {[c.dataset.key]: on});
    if (on && !wasDone && isComplete(w)) celebrate(c, true);
    return; }
  const a = e.target.closest("[data-all]");
  if (a){ const w = WORKS.find(x=>x.pkg===a.dataset.all); const v = !isComplete(w);
    if (v) celebrate(a, true);
    write("works/"+w.pkg, Object.fromEntries(ITEMS.map(([k])=>[k,v]))); return; }
  const bk = e.target.closest("[data-bulk]");
  if (bk){
    const det = bk.closest("details.bidder");
    const pkgs = [...det.querySelectorAll("[data-all]")].map(x=>x.dataset.all);
    const k = bk.dataset.key, v = !pkgs.every(p=>state["works/"+p]?.[k]);
    if (v) celebrate(bk, true);
    writeMany(pkgs.map(p=>["works/"+p, {[k]: v}])); return; }
  const sb = e.target.closest("[data-set]");
  if (sb){ filt.set = sb.dataset.set; syncSeg(); saveUI(); render(); return; }
  const tb = e.target.closest("[data-st]");
  if (tb){ filt.st = tb.dataset.st; syncSeg(); render(); }
});
document.addEventListener("toggle", e => {
  const d = e.target; if (!d.matches?.("details.bidder")) return;
  d.open ? open.add(d.dataset.b) : open.delete(d.dataset.b); saveUI();
}, true);
document.addEventListener("change", async e => {
  if (e.target.id !== "listFile" || !e.target.files[0] || !fsRef) return;
  try {
    const list = JSON.parse(await e.target.files[0].text());
    if (!Array.isArray(list) || !list.length || !list[0].pkg) throw new Error("That file isn't the work list.");
    setStatus("Saving the work list…");
    await fsRef.doc("meta/works").set({list});
    setStatus("Work list saved · " + list.length + " works");
  } catch(err){ setStatus("Couldn't load the file: " + (err.code || err.message)); }
});
document.getElementById("q").addEventListener("input", e => { filt.q = e.target.value; render(); });
function syncSeg(){
  document.querySelectorAll("[data-set]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.set===filt.set));
  document.querySelectorAll("[data-st]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.st===filt.st));
}
syncSeg(); render();

(async () => {
  const cfg = window.FIREBASE_CONFIG;
  if (!window.firebase || !cfg || !cfg.apiKey){ setStatus("Sync isn't set up yet. Ticks are saved on this device only."); return; }
  firebase.initializeApp(cfg);
  const auth = firebase.auth(), fs = firebase.firestore(); fsRef = fs;
  const btn = document.getElementById("auth");
  btn.hidden = false; canWrite = false; render();
  btn.onclick = async () => {
    if (auth.currentUser) { auth.signOut(); return; }
    const p = new firebase.auth.GoogleAuthProvider();
    setStatus("Opening Google sign-in…");
    try { await auth.signInWithPopup(p); }
    catch(e){
      // Redirect sign-in silently fails here (the sign-in helper lives on another domain), so stay with the popup.
      if (e.code === "auth/popup-blocked") setStatus("Your browser blocked the sign-in popup. Allow pop-ups for this site (icon at the right of the address bar), then click Sign in again.");
      else if (e.code === "auth/popup-closed-by-user" || e.code === "auth/cancelled-popup-request") setStatus("Sign-in was closed before finishing. Click Sign in with Google to try again.");
      else if (e.code === "auth/unauthorized-domain") setStatus("Sign-in isn't allowed from this web address yet (" + location.hostname + ").");
      else setStatus("Sign-in failed (" + e.code + "): " + e.message);
    }
  };
  let unsub = null;
  auth.onAuthStateChanged(u => {
    if (unsub){ unsub(); unsub = null; }
    if (!u){ db = null; canWrite = false; WORKS = []; needList = false; worksMsg = "Sign in with Google to load the 96 works."; btn.textContent = "Sign in with Google"; setStatus("Sign in to see and save the shared ticks."); render(); return; }
    btn.textContent = "Sign out";
    setStatus("Loading shared ticks…");
    let first = true;
    const unList = fs.doc("meta/works").onSnapshot(doc => {
      const list = doc.exists ? doc.data().list : null;
      if (list && list.length){ WORKS = list; needList = false; render(); return; }
      WORKS = []; needList = true; worksMsg = "The work list isn't in the database yet. Load it once from work-list.json in the checklist-website folder.";
      if (window.SEED_WORKS){
        worksMsg = "Loading the work list into the database…";
        fs.doc("meta/works").set({list: window.SEED_WORKS}).catch(e => setStatus("Couldn't load the work list (" + e.code + ")."));
      }
      render();
    }, err => { worksMsg = err.code === "permission-denied" ? u.email + " isn't allowed to see the work list." : "Couldn't load the work list (" + err.code + ")."; render(); });
    const unTicks = fs.collection("works").onSnapshot(snap => {
      db = fs; canWrite = true;
      for (const d of snap.docs) state["works/"+d.id] = d.data();
      try { localStorage.setItem("ticks", JSON.stringify(state)); } catch(e){}
      if (first){ setStatus("Synced · signed in as " + u.email); first = false; }
      render();
    }, err => {
      db = null; canWrite = false; render();
      setStatus(err.code === "permission-denied" ? u.email + " isn't on the allowed list. Add it to the Firestore rules." : "Sync paused (" + err.code + ").");
    });
    unsub = () => { unList(); unTicks(); };
  });
})();
</script>

</body>
</html>
